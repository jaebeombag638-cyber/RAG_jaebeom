# Local practice only. Ports are exposed to this PC only.
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata953:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: http://es:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - es
volumes:
  esdata953:
